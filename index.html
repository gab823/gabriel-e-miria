<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel e Miriã</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 1.8em;
    }

    #counter {
      font-size: 1.5em;
      margin: 10px 0 30px;
      color: #e91e63;
    }

    .slideshow {
      width: 90vw;
      max-width: 500px;
      height: auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .slideshow img {
      width: 100%;
      display: none;
    }

    .slideshow img.active {
      display: block;
    }

    .spotify {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Eu te amo e te admiro há</h1>
  <div id="counter"></div>

  <div class="slideshow">
    <img src="fotos/foto1.jpg" class="active" />
    <img src="fotos/foto2.jpg" />
    <img src="fotos/foto3.jpg" />
    <img src="fotos/foto4.jpg" />
    <img src="fotos/foto5.jpg" />
  </div>

  <div class="spotify">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/2o2xhyri4aJUtgMGkf5P0J?utm_source=generator" width="300" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <script>
    // CONTADOR
    const startDate = new Date("2024-10-04T00:00:00");
    const counter = document.getElementById("counter");

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      counter.innerText = `${days} dias, ${hours} horas, ${minutes} minutos e ${seconds} segundos`;
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    // SLIDESHOW
    const slides = document.querySelectorAll(".slideshow img");
    let current = 0;
    setInterval(() => {
      slides[current].classList.remove("active");
      current = (current + 1) % slides.length;
      slides[current].classList.add("active");
    }, 3000);
  </script>
</body>
</html>
